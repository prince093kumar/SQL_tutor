version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sqllab_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sqllab
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: sqllab_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql_data:
